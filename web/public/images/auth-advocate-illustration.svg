<svg width="520" height="520" viewBox="0 0 520 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of an advocate working at a desk with the scales of justice">
  <defs>
    <linearGradient id="archGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3dfac" />
      <stop offset="55%" stop-color="#e7c98a" />
      <stop offset="100%" stop-color="#c79a4d" />
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a6b" />
      <stop offset="100%" stop-color="#222e47" />
    </linearGradient>
    <linearGradient id="robeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aebbd6" />
      <stop offset="100%" stop-color="#5b6d94" />
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef1f7" />
      <stop offset="100%" stop-color="#cfd6e4" />
    </linearGradient>
    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Soft arch backdrop -->
  <path d="M70 460 V230 a190 190 0 0 1 380 0 V460 Z" fill="url(#archGrad)" opacity="0.35" />
  <circle cx="260" cy="225" r="150" fill="url(#haloGrad)" />

  <!-- Desk -->
  <rect x="120" y="372" width="280" height="16" rx="8" fill="url(#deskGrad)" />
  <rect x="150" y="388" width="14" height="64" rx="4" fill="#222e47" />
  <rect x="356" y="388" width="14" height="64" rx="4" fill="#222e47" />

  <!-- Stack of law books -->
  <g>
    <rect x="128" y="338" width="74" height="16" rx="3" fill="#c79a4d" />
    <rect x="132" y="322" width="66" height="16" rx="3" fill="#5b6d94" />
    <rect x="128" y="306" width="74" height="16" rx="3" fill="#3a4a6b" />
  </g>

  <!-- Scales of justice on the desk -->
  <g stroke="#c79a4d" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="352" y1="372" x2="352" y2="318" />
    <line x1="320" y1="330" x2="384" y2="330" />
    <path d="M320 330 q-14 28 0 28 q14 0 0 -28" />
    <path d="M384 330 q-14 28 0 28 q14 0 0 -28" />
    <circle cx="352" cy="314" r="5" fill="#c79a4d" stroke="none" />
  </g>

  <!-- Laptop -->
  <g>
    <rect x="222" y="340" width="92" height="60" rx="6" fill="url(#laptopGrad)" stroke="#aebbd6" stroke-width="2" />
    <rect x="230" y="348" width="76" height="44" rx="3" fill="#222e47" />
    <path d="M214 400 h106 l8 14 h-122 Z" fill="#dfe4ee" stroke="#c3cbdc" stroke-width="1.5" />
    <!-- mini scales icon glowing on the screen -->
    <g stroke="#f3dfac" stroke-width="2.5" stroke-linecap="round" fill="none">
      <line x1="268" y1="356" x2="268" y2="378" />
      <line x1="254" y1="364" x2="282" y2="364" />
      <path d="M254 364 q-7 14 0 14 q7 0 0 -14" />
      <path d="M282 364 q-7 14 0 14 q7 0 0 -14" />
    </g>
  </g>

  <!-- Advocate figure seated at the desk -->
  <g>
    <!-- chair back -->
    <rect x="246" y="262" width="56" height="70" rx="14" fill="#3a4a6b" />
    <!-- robe / body -->
    <path d="M232 392 q0 -64 42 -64 q42 0 42 64 Z" fill="url(#robeGrad)" />
    <!-- collar -->
    <path d="M260 332 l14 14 l14 -14 Z" fill="#f7f9fc" />
    <!-- tie -->
    <path d="M271 344 l6 0 l5 30 l-8 10 l-8 -10 Z" fill="#c79a4d" />
    <!-- arms resting toward laptop -->
    <path d="M252 360 q-6 18 14 30" stroke="#5b6d94" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M296 360 q6 18 -14 30" stroke="#5b6d94" stroke-width="14" stroke-linecap="round" fill="none" />
    <!-- head -->
    <circle cx="274" cy="306" r="26" fill="#f3dab7" />
    <!-- hair -->
    <path d="M250 300 a24 24 0 0 1 48 0 q-2 -14 -24 -14 q-22 0 -24 14 Z" fill="#3a4a6b" />
    <!-- simple face -->
    <circle cx="266" cy="308" r="2.6" fill="#3a4a6b" />
    <circle cx="282" cy="308" r="2.6" fill="#3a4a6b" />
    <path d="M266 318 q8 6 16 0" stroke="#3a4a6b" stroke-width="2.4" fill="none" stroke-linecap="round" />
  </g>

  <!-- Floating gavel accent -->
  <g transform="translate(118 184) rotate(-18)">
    <rect x="0" y="14" width="44" height="14" rx="6" fill="#c79a4d" />
    <rect x="14" y="0" width="14" height="42" rx="6" fill="#3a4a6b" />
    <rect x="-6" y="36" width="58" height="10" rx="4" fill="#5b6d94" />
  </g>

  <!-- Floating document accent -->
  <g transform="translate(372 158) rotate(12)">
    <rect width="58" height="74" rx="8" fill="#ffffff" stroke="#e7c98a" stroke-width="2" />
    <line x1="12" y1="20" x2="46" y2="20" stroke="#c79a4d" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="34" x2="46" y2="34" stroke="#aebbd6" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="48" x2="34" y2="48" stroke="#aebbd6" stroke-width="3" stroke-linecap="round" />
    <path d="M16 60 l6 6 l12 -14" stroke="#3a4a6b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

